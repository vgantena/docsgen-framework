name: CI

on:
  pull_request:
  push:
    # develop is the integration branch (features branch from it and merge back);
    # main is the promoted lane. Both are gated — main only ever fast-forwards
    # from develop, but running here keeps that assumption honest.
    branches: [develop, main]
  schedule:
    # Weekly external-link sweep (the links job below) — internal links are
    # already checked on every build via onBrokenLinks: throw.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Environment sanity first — fails only on hard breakage (Node/deps);
      # feature warnings (no ffmpeg/pandoc on the runner) are expected here.
      - name: Doctor (setup validation)
        run: npm run doctor

      - name: Markdown structure lint
        run: npm run lint:md

      - name: Install Vale
        run: |
          curl -sSL --fail https://github.com/errata-ai/vale/releases/download/v3.15.1/vale_3.15.1_Linux_64-bit.tar.gz \
            | sudo tar xz -C /usr/local/bin vale
          vale sync

      - name: Prose lint
        run: npm run lint:prose

      - name: Tooling lint (ESLint)
        run: npm run lint:js

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (docgen planner)
        run: npm test

      - name: Docgen planner smoke (assert expected plan)
        run: |
          npm run docgen:plan -- --spec docgen/examples/spec-v1.example.json \
            --manifest docgen/examples/empty-manifest.json \
            --write --out "$RUNNER_TEMP/plan.json"
          node -e "
            const p = require(process.env.RUNNER_TEMP + '/plan.json').plan;
            const got = [p.ADD.length, p.UPDATE.length, p.REVIEW.length, p.REMOVE.length, p.SKIP.length].join(',');
            if (got !== '4,0,0,0,0') { console.error('unexpected plan (ADD,UPDATE,REVIEW,REMOVE,SKIP): ' + got); process.exit(1); }
            console.log('plan OK: 4 ADD, nothing else');
          "

      - name: Build (includes broken-link check)
        run: npm run build

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (docgen planner)
        run: npm test

      - name: Markdown structure lint
        run: npm run lint:md

      # Vale is covered on the ubuntu job; skipped here to keep this job reliable.
      - name: Build (includes broken-link check)
        run: npm run build

  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pandoc (>= 3, required for the typst engine)
        run: |
          curl -sSL --fail -o /tmp/pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.6.3/pandoc-3.6.3-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: Install typst
        run: |
          curl -sSL --fail -o /tmp/typst.tar.xz \
            https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      # build-pdf.mjs uses only the Node standard library — no npm ci needed.
      - name: Build the PDF manual
        run: npm run pdf

  # External links only — internal links fail the build itself. Scheduled weekly
  # (plus manual dispatch) so third-party flakiness never blocks a PR.
  links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check external links in docs
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress --scheme https --scheme http
            --exclude 'localhost' --exclude '127\.0\.0\.1' --exclude 'example\.com'
            'docs/**/*.md' 'docs/**/*.mdx' 'README.md'
          fail: true

  # Lighthouse over the built site (config: lighthouserc.json). The assertion
  # gates the ACCESSIBILITY category only (minScore 0.9 on /, the items guide,
  # and the items API page) — performance/SEO numbers are informational.
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production site)
        run: npm run build

      # A route that does not exist in build/ silently scores the 404 page, so
      # the gate would pass while testing nothing. Fail loudly instead.
      - name: Assert every Lighthouse route exists in the build
        run: |
          node -e "
            const {existsSync} = require('fs');
            const urls = require('./lighthouserc.json').ci.collect.url;
            const missing = urls.filter((u) => {
              const base = 'build' + u.replace(/\/\$/, '');
              return !existsSync(base + '/index.html') && !existsSync(base + '.html');
            });
            if (missing.length) {
              console.error('lighthouserc.json points at routes that are not in the build: ' + missing.join(', '));
              process.exit(1);
            }
            console.log('all ' + urls.length + ' Lighthouse routes exist');
          "

      - name: Lighthouse CI (accessibility gate)
        run: npx --yes @lhci/cli@0.14.x autorun
