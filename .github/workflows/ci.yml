name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Markdown structure lint
        run: npm run lint:md

      - name: Install Vale
        run: |
          curl -sSL https://github.com/errata-ai/vale/releases/download/v3.15.1/vale_3.15.1_Linux_64-bit.tar.gz \
            | sudo tar xz -C /usr/local/bin vale
          vale sync

      - name: Prose lint
        run: npm run lint:prose

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (docgen planner)
        run: npm test

      - name: Docgen planner smoke (deterministic plan on example spec)
        run: npm run docgen:plan -- --spec docgen/examples/spec-v1.example.json

      - name: Build (includes broken-link check)
        run: npm run build
