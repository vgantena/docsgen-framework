name: Lane guard

# Enforces the one invariant the promote job depends on:
#
#   every commit on `main` is a commit that already exists on `develop`
#
# which is true after a fast-forward and false after a squash, a rebase, a merge
# commit, or a commit pushed straight to `main`. Each of those mints a sha that
# `develop` never built an image for, so `promote` would fail anyway — but it
# fails at the registry with "image does not exist", which reads like a registry
# problem rather than a merge-method mistake. This says what actually went wrong.
#
# Branch protection is the preventive control and should be preferred. This is
# the detective one, and it is what a repo on a plan WITHOUT protection (private
# repos on GitHub Free) gets instead — it cannot block the push, but it fails
# loudly the moment it happens.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-forward-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: reachability cannot be decided from a shallow clone.
          fetch-depth: 0

      - name: main must sit on a commit develop already built
        run: |
          set -euo pipefail
          git fetch --quiet origin develop

          if git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            echo "main is at $GITHUB_SHA, which is on develop — promoted by fast-forward."
            exit 0
          fi

          echo "::error title=main was not fast-forwarded::$GITHUB_SHA is not on develop, so no image was ever built for it. Promotion will fail. main must be advanced with: git checkout main && git merge --ff-only develop && git push origin main"
          echo ""
          echo "Commits on main that develop does not have:"
          git log --oneline origin/develop..HEAD | head -20
          exit 1
