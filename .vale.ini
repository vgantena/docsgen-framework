# Prose linting: npm run lint:prose  (first run: vale sync)
StylesPath = .vale/styles
MinAlertLevel = suggestion

# Pinned so `vale sync` is reproducible (matches the vendored .vale/styles/Microsoft).
Packages = https://github.com/errata-ai/Microsoft/releases/download/v0.14.1/Microsoft.zip

# Project terms (Docusaurus, navbar, ffmpeg, …) live in
# .vale/styles/config/vocabularies/Docs/accept.txt
Vocab = Docs

[formats]
mdx = md

[{docs,templates}/**/*.{md,mdx}]
BasedOnStyles = Vale, Microsoft, Docs

# Component/JSX lines are not prose.
#
# Tried and REJECTED: adding a quoted-span pattern here to spare the literal API
# messages an endpoint reference quotes so heavily. It has no effect — Vale
# applies TokenIgnores before the markdown scoping that table cells go through,
# so the alerts fire anyway (verified against straight, curly and single quotes).
# Literals are handled by the rule-level settings below instead.
TokenIgnores = (<[A-Z][^>]*>), (</[A-Z][a-zA-Z]*>), (\{[^}]*\})

# Docs speak to "you"; first-person plural is the vendor voice we avoid anyway.
Microsoft.We = error
# Headings are sentence case but product names stay capitalized — keep as warning.
Microsoft.Headings = warning
# House style uses spaced em dashes ( — ), overriding Microsoft here.
Microsoft.Dashes = NO

# ── Rules that misread API reference content ────────────────────────────────
# An endpoint page quotes literal values constantly — response messages, status
# strings, enum members. Several Microsoft rules assume everything in quotes is
# a phrase, and "fixing" them makes the documentation state something false.

# Wants American punctuation-inside-quotes. Wrong when the quoted text is a
# LITERAL VALUE rather than a phrase:
#
#     | `401` | — | "Authentication required". |
#
# Moving the period inside makes it read as part of the string the API returns.
# Prose that quotes a SENTENCE should still put the stop inside — that is a
# review judgement, not something this rule can tell apart.
Microsoft.Quotes = NO

# Objects to the "(s)" in `http(s)`, which appears inside the exact strings APIs
# return, and to hyphenated technical compounds ("auto-retry" → "autoretry")
# where the hyphenated form is standard.
Microsoft.Plurals = NO
Microsoft.Auto = NO

# Contractions is DIFFERENT from the rules above — it has real signal, finding
# genuine prose fixes ("cannot be undone" → "can't be undone"). What it cannot
# tell apart is quoted API messages, which must stay verbatim. So it is demoted
# rather than disabled: still reported, no longer able to fail the gate on a
# string you are not allowed to edit. Read its warnings when you touch prose.
Microsoft.Contractions = warning

# ── Your domain may need more ───────────────────────────────────────────────
# Some rules read domain DATA as English and misfire on it. Demote those in your
# own copy rather than here, so the gate is not weakened for everyone else. Two
# rules that commonly need it:
#
#   Microsoft.DateOrder   — reads a slash-separated numeric list (rates, sizes,
#                           versions) as a malformed date
#   Microsoft.Percentages — fires where "percent" is a noun and correct
#
# Add such a line only after checking every hit instance by instance, and say in
# a comment which content justified it — so the next person can re-enable it
# when that content changes.
