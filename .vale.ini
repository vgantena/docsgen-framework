# Prose linting: npm run lint:prose  (first run: vale sync)
StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = Microsoft

# Project terms (Docusaurus, navbar, ffmpeg, …) live in
# .vale/styles/config/vocabularies/Docs/accept.txt
Vocab = Docs

[formats]
mdx = md

[docs/**/*.{md,mdx}]
BasedOnStyles = Vale, Microsoft

# Component/JSX lines are not prose.
TokenIgnores = (<[A-Z][^>]*>), (</[A-Z][a-zA-Z]*>), (\{[^}]*\})

# Docs speak to "you"; first-person plural is the vendor voice we avoid anyway.
Microsoft.We = error
# Headings are sentence case but product names stay capitalized — keep as warning.
Microsoft.Headings = warning
# House style uses spaced em dashes ( — ), overriding Microsoft here.
Microsoft.Dashes = NO
