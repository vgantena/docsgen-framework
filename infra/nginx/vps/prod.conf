# Docs site — PROD edge. Host: docs.example.com
#
# This repo OWNS docs.example.com. The app repo deliberately does not serve
# this name: two configs claiming one server_name is resolved by install order,
# not by intent, and that is exactly how a live site gets black-holed by an
# unrelated deploy. If you ever re-add a docs block over there, delete this one
# in the same change.
#
# TLS: the wildcard *.example.com cert (certbot DNS-01), mounted from
# /etc/letsencrypt — the same cert the app edge uses, which is the payoff for
# keeping every hostname a single label.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name docs.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/docs-auth-gate.conf;

    # Where the session is verified. PROD docs trusts the PROD app — never point
    # a lower environment's edge at this one, or a Dev session would unlock
    # production documentation.
    #
    # The origin is a LITERAL, deliberately. A variable in proxy_pass defers DNS
    # to request time and then REQUIRES a `resolver`; without one every page
    # 500s with "no resolver defined to resolve …" on the auth subrequest. That
    # passes `nginx -t`, so it surfaces only under real traffic. A literal is
    # resolved at startup: a DNS problem then fails the container loudly instead
    # of silently breaking every request.
    location = /_docs_auth {
        internal;
        proxy_pass https://app.example.com/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host app.example.com;
        proxy_set_header X-Original-URI $request_uri;
        # Pass the real caller through. Without these the app sees only THIS
        # edge's address, so every docs visitor shares one rate-limit bucket and
        # every audit line reads as the proxy rather than the person.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @docs_login {
        return 302 https://app.example.com/?next=https://$host$request_uri;
    }

    # The health probe must stay reachable without a session, or the monitor
    # reports the site down for everyone the moment auth has a bad day.
    location = /healthz {
        auth_request off;
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://docs:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
