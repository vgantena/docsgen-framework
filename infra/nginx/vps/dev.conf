# Docs site — Dev edge. Host: docs.example.dev
#
# Dev lives on its OWN registrable domain, not under the prod one, matching the
# app stack: every hostname stays a single label, so one wildcard covers the
# environment and a Dev session cookie can never be sent to a prod host.
#
# .dev is HSTS-preloaded — browsers refuse plain HTTP outright. The port-80
# block below exists only for certbot's ACME challenge, never user traffic.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# The whole Dev environment is IP-allowlisted, same as the app's Dev edge.
geo $dev_allowed {
    default 0;
    # ADD YOUR OFFICE/HOME IPs HERE before first deploy:
    # 203.0.113.10/32 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name docs.example.dev;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs.example.dev;

    ssl_certificate     /etc/letsencrypt/live/example.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.dev/privkey.pem;

    if ($dev_allowed = 0) { return 403; }

    # ── Why Dev serves the PROD canonical URL ──────────────────────────────
    # Docusaurus BAKES `url` into every canonical tag, sitemap entry and
    # absolute link at build time. Building it per environment would mean the
    # image tested on Dev is not the digest shipped to PROD — the one rule the
    # app stack is strictest about.
    #
    # So the canonical stays the prod URL in every environment (which is also
    # correct SEO: a staging copy should point search engines at the real page,
    # never compete with it), and Dev is kept out of the index here instead.
    # One image, promoted; no duplicate-content risk.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    include /etc/nginx/snippets/docs-auth-gate.conf;

    # Dev docs verify against the DEV app. Pointing this at prod would let a
    # production session unlock the Dev site, and vice versa.
    #
    # LITERAL origin, not a variable — see the note in vps/prod.conf: a variable
    # needs a `resolver` and 500s every page without one, and `nginx -t` cannot
    # catch it.
    location = /_docs_auth {
        internal;
        proxy_pass https://app.example.dev/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host app.example.dev;
        proxy_set_header X-Original-URI $request_uri;
        # Pass the real caller through. Without these the app sees only THIS
        # edge's address, so every docs visitor shares one rate-limit bucket and
        # every audit line reads as the proxy rather than the person.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @docs_login {
        return 302 https://app.example.dev/?next=https://$host$request_uri;
    }

    location = /healthz {
        auth_request off;
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://docs:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
