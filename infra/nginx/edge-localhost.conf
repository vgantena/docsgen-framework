# Docs site — localhost edge. Host: http://docs.localhost
#
# Browsers resolve *.localhost to 127.0.0.1 natively, so this needs no
# hosts-file entry and mirrors the VPS topology:
#   local  docs.localhost   dev  docs.example.dev   prod  docs.example.com
#
# DELIBERATELY UNGATED. The Dev and PROD edges include auth-gate.conf; this one
# does not, because writing documentation should not require a running app,
# a database and a valid session. Authoring is the one context where the gate
# only costs you.
#
# The app stack's own edge (the application repo) claims app./admin./support./web.
# .localhost — it no longer claims docs., so both stacks can run side by side
# on :80 as long as only one of them binds it. Run this one, or add a docs.
# passthrough there; do not define docs.localhost in both.

server {
    listen 80;
    server_name docs.localhost;

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://docs:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
