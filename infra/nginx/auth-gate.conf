# Docs site — "registered users only" gate.
#
# `include`d by the Dev and PROD edges from INSIDE a server block. Localhost
# deliberately does not include it: authors need the site to open without a
# running app, and gating it locally makes writing docs depend on a database.
#
# How it works: nginx asks the app's server whether the caller's session cookie
# is valid before serving anything. The docs site itself has no auth code, no
# user table and no session — it only asks. That is the whole reason to gate at
# the edge rather than in Docusaurus, which is a static export and cannot.
#
# TWO REQUIREMENTS, both easy to get wrong:
#
#  1. The browser must SEND the session cookie to docs.*. The app issues a
#     HOST-ONLY cookie by default, which `app.example.com` alone receives.
#     Set SESSION_COOKIE_DOMAIN=.example.com (and .example.dev on Dev) in
#     the app's .env or every request here arrives anonymous and the site is
#     simply unreachable — a 302 loop, not an error anyone can read.
#
#  2. $app_origin must be resolvable from this edge. It is set per environment
#     in the including file.
#
# To publish the docs publicly, delete the `auth_request` line below (or stop
# including this file). Nothing else depends on it.

auth_request /_docs_auth;

# Anonymous -> send them to the app's login, remembering where they were going
# so they land back on the page they asked for rather than a dashboard.
#
# 401 ONLY. 403 deliberately does not redirect: the Dev edge answers 403 for an
# IP outside its allowlist, and mapping that to the login would send a blocked
# visitor to sign in, then still refuse them — a loop with no explanation. A
# 403 means "not you, ever", which is a different answer from "not yet".
error_page 401 = @docs_login;
