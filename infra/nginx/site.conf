# Docs site — the static server INSIDE the image.
#
# Host routing, TLS and access control live at the edge (infra/nginx/vps/*.conf,
# infra/nginx/edge-localhost.conf). This file only knows how to serve files, so
# the same image works unchanged behind every environment's edge.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docusaurus uses trailing slashes, so every /page hits nginx's directory
    # redirect. By default that Location is ABSOLUTE and rebuilt from this
    # server's own view of the request — which behind the edge means
    # `http://docs.example.com/page/`: the port is dropped and the scheme
    # downgraded to http. On an HSTS host that is a wasted hop at best.
    #
    # Relative redirects let the browser keep the scheme, host and port it is
    # already on, which is always right regardless of what fronts this image.
    absolute_redirect off;

    # Docusaurus fingerprints everything under /assets/, so those are immutable.
    # HTML is NOT: it names the current asset hashes, so a cached page would keep
    # pointing at files a later deploy has already removed.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|avif|ico|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Docusaurus emits a real .html per route, so a plain 404 is correct — there
    # is no SPA fallback to rewrite into. Serving index.html for unknown paths
    # would turn every dead link into a silent 200 and hide broken navigation.
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
